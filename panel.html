<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trae 面板</title>
<style>
/* Theme tokens aligned with CPA management panel (key-policy / themes.scss):
   default :root = light (paper); data-theme=white | dark; embedded iframe syncs parent. */
:root{
  --bg:#faf9f5;--card:#ffffff;--border:#e3e1db;--fg:#2d2a26;--mut:#6d6760;
  --acc:#4c8dff;--on-acc:#ffffff;--ok:#10b981;--warn:#e0aa14;--err:#c65746;
  --surface:#f0eee8;--surface-muted:#e9e6df;--btn-sec:#eef1f6;--btn-sec-hover:#e4e8ef;
  --input-bg:#ffffff;--code-bg:#f3f4f6;--code-fg:#374151;--placeholder:rgba(109,103,96,.55);
  --ok-soft:rgba(16,185,129,.10);--ok-border:rgba(16,185,129,.30);
  --warn-soft:rgba(224,170,20,.12);--warn-border:rgba(224,170,20,.32);
  --err-soft:rgba(198,87,70,.10);--err-border:rgba(198,87,70,.30);
  --mut-soft:rgba(109,103,96,.12);--mut-border:rgba(109,103,96,.28);
  --scrim:rgba(45,42,38,.35);--toast-shadow:0 10px 28px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.04);
  --modal-shadow:0 24px 56px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.04);
  --acc-ring:rgba(76,141,255,.18);--radius-md:12px;--radius-lg:16px;
  color-scheme:light
}
:root[data-theme="white"]{
  --bg:#f5f5f5;--card:#ffffff;--border:#e6e6e6;--fg:#1f1f1f;--mut:#707070;
  --surface:#fafafa;--surface-muted:#efefef;--btn-sec:#f0f0f0;--btn-sec-hover:#e8e8e8;
  --input-bg:#ffffff;--code-bg:#f3f4f6;--code-fg:#374151;--placeholder:rgba(112,112,112,.55);
  --scrim:rgba(0,0,0,.32);--toast-shadow:0 10px 28px rgba(0,0,0,.10),0 0 0 1px rgba(0,0,0,.04);
  --modal-shadow:0 24px 56px rgba(0,0,0,.16),0 0 0 1px rgba(0,0,0,.04);
  color-scheme:light
}
:root[data-theme="dark"]{
  --bg:#1e1d1b;--card:#26241f;--border:#3a3833;--fg:#ede9e3;--mut:#9a948c;
  --acc:#4c8dff;--on-acc:#ffffff;--ok:#34d399;--warn:#f0c050;--err:#e07a6a;
  --surface:#2f2d28;--surface-muted:#35332e;--btn-sec:#35332e;--btn-sec-hover:#3f3c36;
  --input-bg:#1e1d1b;--code-bg:#35332e;--code-fg:#d6d1c9;--placeholder:rgba(154,148,140,.55);
  --ok-soft:rgba(52,211,153,.12);--ok-border:rgba(52,211,153,.38);
  --warn-soft:rgba(240,192,80,.14);--warn-border:rgba(240,192,80,.38);
  --err-soft:rgba(224,122,106,.12);--err-border:rgba(224,122,106,.38);
  --mut-soft:rgba(154,148,140,.16);--mut-border:rgba(154,148,140,.32);
  --scrim:rgba(0,0,0,.55);--toast-shadow:0 10px 28px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.03);
  --modal-shadow:0 24px 56px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.04);
  --acc-ring:rgba(76,141,255,.28);
  color-scheme:dark
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px;margin-bottom:20px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
button{background:var(--acc);color:var(--on-acc);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}
button.sec{background:var(--btn-sec);color:var(--fg)}button.sec:hover{background:var(--btn-sec-hover)}button:disabled{opacity:.5;cursor:default}
.toggle{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card,.summary{background:var(--card);border:1px solid var(--border);border-radius:12px}
.card{padding:16px}
.card.selected{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-ring)}
.card h2{font-size:15px;margin:0 0 2px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.uid{color:var(--mut);font-size:11px;font-family:ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:12px}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-border)}
.badge.active{background:var(--acc-ring);color:var(--acc);border-color:var(--acc)}
.badge.cooling{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-border)}
.badge.disabled{background:var(--mut-soft);color:var(--mut);border:1px solid var(--mut-border)}
.badge.err{background:var(--err-soft);color:var(--err);border:1px solid var(--err-border)}
.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.ftag{background:var(--surface);border:1px solid var(--border);color:var(--mut);border-radius:99px;padding:5px 14px;font-size:12px;cursor:pointer;font-weight:600}
.ftag.active{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.ftag .cnt{font-size:10px;opacity:.75;margin-left:4px}
/* 用量汇总与账号卡共用 --card，避免夜间两套底色 */
.summary{padding:16px;margin-bottom:14px}
.summary-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.summary-title{font-weight:700;font-size:14px}
.summary-meta{color:var(--mut);font-size:12px}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:10px}
/* 内嵌指标格：与账号卡内部表面一致（--surface），不用更深的 surface-muted */
.summary-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.summary-item .k{color:var(--mut);font-size:11px;margin-bottom:4px}
.summary-item .v{font-size:18px;font-weight:700}
.summary-item .v.ok{color:var(--ok)}
.summary-item .v.warn{color:var(--warn)}
.summary-item .v.err{color:var(--err)}

.summary .pb{margin-top:4px}
.row{display:flex;justify-content:space-between;padding:5px 0;border-top:1px dashed var(--border);gap:12px}
.row:first-of-type{border-top:0}.k{color:var(--mut)}.v{font-weight:600}
.v.ok{color:var(--ok)}.v.warn{color:var(--warn)}.v.err{color:var(--err)}
.pb{margin-top:10px}
.pb-label{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:6px}
.pb-track{height:8px;background:var(--surface-muted);border-radius:99px;overflow:hidden}
.pb-bar{height:100%;background:var(--ok);border-radius:99px;transition:width .6s ease}
.pb-meta{font-size:11px;color:var(--mut);margin-top:6px}
.actions{margin-top:12px;display:flex;gap:8px}
.field-input{flex:1;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--fg)}
/* 右上角滑入通知栈 */
.toasts{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:10px;z-index:9999;max-width:360px}
.toast{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--acc);border-radius:var(--radius-md);padding:14px 18px;font-size:13px;box-shadow:var(--toast-shadow);transform:translateX(120%);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.3,1.1),opacity .25s;cursor:pointer;word-break:break-all}
.toast.show{transform:translateX(0);opacity:1}
.toast.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.toast.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.toast.err{border-left-color:var(--err);background:var(--err-soft)}
button.done{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-border);cursor:default;opacity:1}
button.done:disabled{opacity:1}
.toast .t{font-weight:600;margin-bottom:3px}
.toast .d{color:var(--mut);font-size:12px;line-height:1.45}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--on-acc);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
button .spin{border-color:var(--on-acc);border-top-color:transparent}
.loading{color:var(--mut);text-align:center;padding:40px}
.modal-mask{position:fixed;inset:0;background:var(--scrim);display:none;align-items:center;justify-content:center;z-index:9000;padding:16px;backdrop-filter:blur(2px)}
.modal-mask.show{display:flex}
.modal{background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:var(--radius-lg);width:min(560px,100%);max-height:min(90vh,640px);display:flex;flex-direction:column;box-shadow:var(--modal-shadow)}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-hd h2{font-size:15px;margin:0;color:var(--fg);font-weight:600}
.modal-x{background:transparent;color:var(--mut);padding:4px 10px;font-size:18px;line-height:1}
.modal-x:hover{color:var(--fg);background:var(--surface-muted)}
.modal-bd{padding:16px;overflow:auto}
.modal-bd .hint{color:var(--mut);font-size:12px;margin:0 0 10px;line-height:1.5}
.modal-bd .hint code{background:var(--code-bg);color:var(--code-fg);padding:1px 5px;border-radius:4px;font-size:11px}
.modal-bd textarea{width:100%;min-height:160px;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--fg);font:12px/1.45 ui-monospace,monospace;resize:vertical;outline:none}
.modal-bd textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-ring)}
.modal-bd textarea::placeholder{color:var(--placeholder)}
.modal-ft{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface);border-radius:0 0 var(--radius-lg) var(--radius-lg)}
.modal-ft button.sec{background:var(--btn-sec);color:var(--fg)}
.modal-ft button.sec:hover{background:var(--btn-sec-hover)}
</style>
<script>
/* Early theme sync (before body paint): mirror CPA parent data-theme when
   embedded; standalone falls back to prefers-color-scheme. Same semantics as
   cpa-plugin-key-policy themeSync (DOM data-theme is source of truth). */
(function(){
  var ATTR="data-theme";
  function embedded(){try{return window.self!==window.top}catch(e){return false}}
  function apply(t){
    var el=document.documentElement;
    if(t==="white"||t==="dark")el.setAttribute(ATTR,t);
    else el.removeAttribute(ATTR);
  }
  function parentTheme(){
    if(!embedded())return null;
    try{
      var raw=window.parent.document.documentElement.getAttribute(ATTR);
      if(raw==="white"||raw==="dark")return raw;
      return "light";
    }catch(e){return null}
  }
  function systemTheme(){
    try{return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch(e){return "light"}
  }
  function sync(){apply(parentTheme()||systemTheme())}
  sync();
  window.__traeThemeSync=function(){
    sync();
    if(!embedded()){
      try{
        var mq=window.matchMedia("(prefers-color-scheme: dark)");
        var on=function(){sync()};
        if(mq.addEventListener)mq.addEventListener("change",on);
        else if(mq.addListener)mq.addListener(on);
      }catch(e){}
      return;
    }
    try{
      var parentEl=window.parent.document.documentElement;
      new MutationObserver(sync).observe(parentEl,{attributes:true,attributeFilter:[ATTR]});
      window.addEventListener("storage",function(e){if(e.key==="cli-proxy-theme")sync()});
    }catch(e){}
  };
})();
</script>
</head>
<body>
<div class="wrap">
  <h1>Trae 账号面板</h1>
  <div class="sub">账号积分 · 每日签到 · Token 刷新 · 版本自动跟踪</div>

  <!-- Management key acquisition (3 fallbacks) -->
  <div id="authBox" class="card" style="display:none;margin-bottom:16px">
    <div style="margin-bottom:8px;color:var(--mut)">需要管理密钥（management key）才能访问账号数据。从 CPA 主面板嵌入时会自动获取，无需输入。错误密钥请勿连点，避免 IP 封禁。</div>
    <div style="display:flex;gap:8px">
      <input id="keyInput" type="password" placeholder="management key" class="field-input">
      <button onclick="saveKey()">连接</button>
    </div>
  </div>

  <div class="bar">
    <button class="sec" id="importBtn" onclick="openImportModal()">导入凭证</button>
    <button id="refreshBtn" onclick="load(true,this)">刷新数据</button>
    <button class="sec" onclick="checkinAll(this)">全部签到</button>
    <button class="sec" onclick="keepaliveAll(this)">刷新 Token</button>
    <button class="sec" onclick="load(false,this)">重新加载</button>
    <label class="toggle" title="每日定时签到（服务端按 checkin_hour 触发）"><input type="checkbox" id="autoToggle" onchange="toggleAuto(this.checked)"> 自动签到</label>
    <span class="toggle" id="svtime"></span>
  </div>

  <div class="filter-bar" id="filterBar">
    <button type="button" class="ftag active" data-status="all" onclick="filterStatus('all',this)">全部 <span class="cnt" id="cntAll">0</span></button>
    <button type="button" class="ftag" data-status="ok" onclick="filterStatus('ok',this)">可用 <span class="cnt" id="cntOk">0</span></button>
    <button type="button" class="ftag" data-status="cooling" onclick="filterStatus('cooling',this)">冷却中 <span class="cnt" id="cntCooling">0</span></button>
    <button type="button" class="ftag" data-status="error" onclick="filterStatus('error',this)">异常 <span class="cnt" id="cntError">0</span></button>
    <button type="button" class="ftag" data-status="disabled" onclick="filterStatus('disabled',this)">已禁用 <span class="cnt" id="cntDisabled">0</span></button>
  </div>

  <div class="summary card" id="summaryBox" style="display:none"></div>
  <div id="grid" class="grid"><div class="loading">加载中…</div></div>
</div>

<div class="modal-mask" id="importModal" onclick="onImportMaskClick(event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="importModalTitle">
    <div class="modal-hd">
      <h2 id="importModalTitle">导入凭证 JSON</h2>
      <button type="button" class="modal-x" onclick="closeImportModal()" aria-label="关闭">×</button>
    </div>
    <div class="modal-bd">
      <p class="hint">支持 nested <code>{"auth":{...},"account":{...}}</code> 或 flat <code>{"access_token":...}</code>。落盘为 <code>trae-&lt;uid&gt;.json</code>，缺签到设备 ID 会自动补齐。</p>
      <textarea id="importRaw" rows="8" placeholder='粘贴 Trae 凭证 JSON'></textarea>
    </div>
    <div class="modal-ft">
      <button type="button" class="sec" onclick="closeImportModal()">取消</button>
      <button type="button" onclick="importAuth(this)">导入并保存</button>
    </div>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script>
/* ---------- management key acquisition (3 fallbacks, zero config) ----------
   1) CPA main panel localStorage "cli-proxy-auth" (XOR+base64, same-origin
      iframe embed) — same approach as cpa-plugin-key-policy.
   2) ?key= URL param (cleaned from history after read, kept in sessionStorage).
   3) Manual input (sessionStorage only, never persisted).
*/
var ENC_PREFIX="enc::v1::";
var SECRET_SALT="cli-proxy-api-webui::secure-storage";
var PANEL_STORE="cli-proxy-auth";
var SS_KEY="trae-mgmt-key";
function _enc(t){return new TextEncoder().encode(t)}
function _dec(b){return new TextDecoder().decode(b)}
function _keyBytes(){try{return _enc(SECRET_SALT+"|"+window.location.host+"|"+navigator.userAgent)}catch(e){return _enc(SECRET_SALT)}}
function _xor(d,k){var r=new Uint8Array(d.length);for(var i=0;i<d.length;i++)r[i]=d[i]^k[i%k.length];return r}
function _b64d(s){var bin=atob(s);var b=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b}
function deobfuscate(p){if(!p||!p.startsWith(ENC_PREFIX))return p;try{return _dec(_xor(_b64d(p.slice(ENC_PREFIX.length)),_keyBytes()))}catch(e){return p}}
function isEmbedded(){try{return window.self!==window.top}catch(e){return false}}

function readPanelKey(){
  if(!isEmbedded())return null;
  var raw;try{raw=localStorage.getItem(PANEL_STORE)}catch(e){return null}
  if(!raw)return null;
  try{
    var parsed=JSON.parse(deobfuscate(raw));
    var st=(parsed&&parsed.state)||parsed||{};
    return typeof st.managementKey==="string"&&st.managementKey?st.managementKey:null;
  }catch(e){return null}
}
function readUrlKey(){
  var m=new URLSearchParams(window.location.search).get("key");
  if(m){
    // 落一份到 sessionStorage：URL 只在首次读取时有效（随后被 history 抹掉），
    // 否则后续 getKey() 会拿不到 key，面板停在"请先填写 management key"。
    sessionStorage.setItem(SS_KEY,m);
    history.replaceState(null,"",window.location.pathname);
  }
  return m;
}
function getKey(){
  return sessionStorage.getItem(SS_KEY)||readPanelKey()||readUrlKey();
}
function saveKey(){
  var v=document.getElementById("keyInput").value.trim();
  if(!v)return;
  sessionStorage.setItem(SS_KEY,v);
  document.getElementById("authBox").style.display="none";
  load(false);
}
function showAuth(){document.getElementById("authBox").style.display="block";var i=document.getElementById("keyInput");i&&i.focus()}
function authHeaders(k){return k?{"Authorization":"Bearer "+k}:{}}
/* --------------------------------------------------------------------------- */

var BASE = location.pathname.replace(/\/v0\/resource\/plugins\/trae.*$/, '') + '/v0/management/plugins/trae';
var lastAccounts = [];
var statusInfo = null;
var versionInfo = null;
var currentFilter = "all";

function toast(title,kind,detail){
  kind=kind||"ok";
  var box=document.getElementById("toasts");
  var el=document.createElement("div");
  el.className="toast "+kind;
  el.innerHTML='<div class="t"></div>'+(detail?'<div class="d"></div>':'');
  el.querySelector(".t").textContent=title;
  if(detail)el.querySelector(".d").textContent=detail;
  box.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("show")));
  var kill=()=>{el.classList.remove("show");setTimeout(()=>el.remove(),300)};
  el.onclick=kill;
  setTimeout(kill,kind==="err"?6000:4000);
  while(box.children.length>5)box.firstChild.remove();
}
function busy(btn,on){
  if(!btn)return;
  if(on){btn.dataset.orig=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span>处理中…'}
  else{btn.disabled=false;if(btn.dataset.orig)btn.innerHTML=btn.dataset.orig}
}
// 立即把签到按钮标记为已完成，避免 load() 重新拉取期间闪回"签到"。
function markCheckinDone(btn){
  if(!btn)return;
  btn.disabled=true;
  btn.className="done";
  btn.innerHTML="已签到";
  btn.dataset.orig="已签到";
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function hasCredits(a){return a&&a.credits!==null&&a.credits!==undefined}
// creditsOf 归一账号的用量三元组（remain/used/size），兼容 credits_detail 与
// 只有 credits 的老数据。known=false 表示没有任何用量信号。
function creditsOf(a){
  var d=(a&&a.credits_detail)||null;
  var remain=0,used=0,size=0;
  if(d){
    remain=Number(d.total_remain)||0;
    used=Number(d.total_used)||0;
    size=Number(d.total_size)||0;
  }else if(hasCredits(a)){
    remain=Number(a.credits)||0;
  }else{
    return {remain:0,used:0,size:0,packs:0,fetched:"",known:false};
  }
  if(!size&&d==null)size=remain+used;
  var known=remain>0||used>0||size>0||((a&&a.credits_detail&&a.credits_detail.pack_count)||0)>0;
  return {
    remain:remain,used:used,size:size,
    packs:(d&&Number(d.pack_count))||0,
    fetched:(d&&d.fetched_at)||"",
    known:known
  };
}
// 进度条配色与 workbuddy 一致：<=60% 绿，>60% 黄，>85% 红。
function pbColor(pct){var c='var(--ok)';if(pct>60)c='var(--warn)';if(pct>85)c='var(--err)';return c}
function whenText(fetched){return fetched?(' · 快照 '+esc(String(fetched).replace('T',' ').replace('Z',' UTC'))):''}
// progressHTML 卡片用量条：可用 X / 已用 Y · Z% + 进度条 + 明细行（同 workbuddy）。
function progressHTML(c){
  if(!c||!c.known){
    return '<div class="pb"><div class="pb-label"><span>可用积分</span><span><span class="spin"></span>加载中…</span></div>'+
           '<div class="pb-track"><div class="pb-bar" style="width:0%"></div></div></div>';
  }
  var total=c.size>0?c.size:(c.remain+c.used);
  var pct=total>0?Math.round(c.used/total*100):0;
  return '<div class="pb">'+
    '<div class="pb-label"><span>可用 '+c.remain+'</span><span>已用 '+c.used+' · '+pct+'%</span></div>'+
    '<div class="pb-track"><div class="pb-bar" style="width:'+pct+'%;background:'+pbColor(pct)+'"></div></div>'+
    '<div class="pb-meta">剩余 '+c.remain+' · 已用 '+c.used+' · 额度池 '+total+
      (c.packs?(' · '+c.packs+' 个包'):'')+whenText(c.fetched)+
    '</div></div>';
}
function statusOf(a){
  if(!a)return "error";
  if(a.disabled)return "disabled";
  if(a.cooling)return "cooling";
  if(a.error)return "error";
  return "ok";
}
function statusBadge(a){
  var st=statusOf(a);
  if(st==="disabled")return '<span class="badge disabled">已禁用</span>';
  if(st==="cooling")return '<span class="badge cooling">冷却中</span>';
  if(st==="error")return '<span class="badge err">异常</span>';
  return '<span class="badge">可用</span>';
}

function bindCardActions(root){
  (root||document).querySelectorAll("[data-action]").forEach(function(btn){
    if(btn._bound)return;
    btn._bound=true;
    btn.addEventListener("click",function(ev){
      var act=ev.currentTarget.dataset.action;
      var idx=ev.currentTarget.dataset.authIndex;
      if(act==="checkin")checkinOne(idx,ev.currentTarget);
      else if(act==="select")selectAuth(idx,ev.currentTarget);
      else if(act==="refresh")refreshOne(idx,ev.currentTarget);
      else if(act==="keepalive")keepaliveOne(idx,ev.currentTarget);
    });
  });
}
function card(a){
  var st=statusOf(a);
  var selected=!!a.selected;
  var selectBtn=selected
    ? '<button class="done" disabled="disabled">使用中</button>'
    : (st==="disabled"?'':'<button class="sec" data-action="select" data-auth-index="'+esc(a.auth_index)+'">选用</button>');
  var checkinBtn='<button class="sec" data-action="checkin" data-auth-index="'+esc(a.auth_index)+'">签到</button>';
  var refreshBtn='<button class="sec" data-action="refresh" data-auth-index="'+esc(a.auth_index)+'" title="重新查询该账号积分">刷新</button>';
  var keepaliveBtn='<button class="sec" data-action="keepalive" data-auth-index="'+esc(a.auth_index)+'" title="刷新该账号 access token">Token</button>';
  var badges=(selected?'<span class="badge active">使用中</span>':'')+statusBadge(a);
  return '<div class="card'+(selected?" selected":"")+'" data-status="'+st+'" data-auth="'+esc(a.auth_index)+'">\n'+
  '  <h2>'+esc(a.nickname||a.label||a.name||"—")+' <span style="display:flex;gap:6px;align-items:center">'+badges+'</span></h2>\n'+
  '  <div class="uid">'+esc(a.uid||"—")+' · '+esc(a.name||"")+'</div>\n'+
  progressHTML(creditsOf(a))+'\n'+
  (a.error?'  <div class="row"><span class="k">错误</span><span class="v err">'+esc(a.error)+'</span></div>\n':'')+
  '  <div class="actions">'+selectBtn+checkinBtn+refreshBtn+keepaliveBtn+'</div>\n'+
  '  </div>';
}
function accountsForFilter(accounts){
  var list=accounts||[];
  if(currentFilter==="all")return list;
  return list.filter(function(a){return statusOf(a)===currentFilter});
}
function updateFilterCounts(accounts){
  var c={ok:0,cooling:0,error:0,disabled:0};
  (accounts||[]).forEach(function(a){c[statusOf(a)]++});
  var set=function(id,v){var el=document.getElementById(id);if(el)el.textContent=String(v)};
  set("cntAll",(accounts||[]).length);
  set("cntOk",c.ok);set("cntCooling",c.cooling);set("cntError",c.error);set("cntDisabled",c.disabled);
}
function filterStatus(status,btn){
  currentFilter=status||"all";
  document.querySelectorAll(".ftag").forEach(function(b){b.classList.remove("active")});
  if(btn)btn.classList.add("active");
  else{
    document.querySelectorAll(".ftag").forEach(function(b){
      if(b.dataset.status===currentFilter)b.classList.add("active");
    });
  }
  document.querySelectorAll("#grid .card").forEach(function(c){
    var show=currentFilter==="all"||(c.dataset.status||"ok")===currentFilter;
    c.style.display=show?"":"none";
  });
  renderSummary(lastAccounts);
}
function updateOneCard(a){
  var el=document.querySelector('#grid .card[data-auth="'+CSS.escape(a.auth_index)+'"]');
  if(!el)return;
  var tmp=document.createElement('div');
  tmp.innerHTML=card(a);
  if(tmp.firstChild){
    var newCard=tmp.firstChild;
    el.replaceWith(newCard);
    bindCardActions(newCard);
  }
  filterStatus(currentFilter,null);
  renderSummary(lastAccounts);
}
function renderSummary(accounts){
  var box=document.getElementById("summaryBox");
  if(!box)return;
  var all=accounts||[];
  if(!all.length){box.style.display="none";box.innerHTML="";return}
  var scoped=accountsForFilter(all);
  var okN=0,coolN=0,errN=0,disN=0,readable=0;
  var remain=0,used=0,size=0,packs=0;
  scoped.forEach(function(a){
    var st=statusOf(a);
    if(st==="ok")okN++;else if(st==="cooling")coolN++;else if(st==="error")errN++;else disN++;
    var c=creditsOf(a);
    if(c.known){remain+=c.remain;used+=c.used;size+=c.size;packs+=c.packs;readable++}
  });
  // 消耗占比：已用 / 额度池（池未知时退回 remain+used）。同 workbuddy 口径。
  var pool=size>0?size:(remain+used);
  var usedPct=pool>0?Math.round(used/pool*100):0;
  var pbCls=usedPct>85?"err":(usedPct>60?"warn":"ok");
  var readPct=scoped.length?Math.round(readable/scoped.length*100):0;
  var scopeLabel=currentFilter==="all"?"全部账号":
    (currentFilter==="ok"?"可用":currentFilter==="cooling"?"冷却中":currentFilter==="error"?"异常":"已禁用")+" 账号";
  var v=versionInfo||{};
  var cache=v.cache||{};
  var s=statusInfo||{};
  var builtin=(v.builtin&&v.builtin.ide_version)||"—";
  var verText=esc(v.ide_version||"—")+(v.version_code?(' · code '+esc(v.version_code)):'')+' · 内置 '+esc(builtin);
  var trackText=(v.tracking?'开启':'关闭')+
    (cache.source?(' · 来源 '+esc(cache.source)):'')+
    (cache.fetched?(' · 快照 '+esc(String(cache.fetched).replace('T',' ').replace('Z',' UTC'))):' · 未探测')+
    (cache.age_secs!=null&&cache.fetched?('（'+esc(cache.age_secs)+'s 前）'):'');
  var schedText='签到 '+(s.checkin_auto?('每日 '+esc(s.checkin_hour)+':00'):'关')+
    ' · 预刷新 '+esc((s.refresh_hours||[]).join(','))+
    ' · 调度 '+esc(s.scheduler_mode||'—')+
    ' · 生命周期 '+(s.lifecycle_auto?'开':'关');
  box.style.display="block";
  box.innerHTML=
    '<div class="summary-hd">'+
      '<div class="summary-title">账号汇总 · '+esc(scopeLabel)+'</div>'+
      '<div class="summary-meta">'+scoped.length+' 个账号 · 插件 v'+esc(s.version||'—')+'</div>'+
    '</div>'+
    '<div class="summary-grid">'+
      '<div class="summary-item"><div class="k">可用</div><div class="v ok">'+okN+'</div></div>'+
      '<div class="summary-item"><div class="k">冷却中</div><div class="v warn">'+coolN+'</div></div>'+
      '<div class="summary-item"><div class="k">异常</div><div class="v err">'+errN+'</div></div>'+
      '<div class="summary-item"><div class="k">已禁用</div><div class="v">'+disN+'</div></div>'+
    '</div>'+
    '<div class="summary-grid">'+
      '<div class="summary-item"><div class="k">剩余(可用)</div><div class="v ok">'+remain+'</div></div>'+
      '<div class="summary-item"><div class="k">已用(消耗)</div><div class="v '+pbCls+'">'+used+'</div></div>'+
      '<div class="summary-item"><div class="k">额度池</div><div class="v">'+(pool||'—')+'</div></div>'+
      '<div class="summary-item"><div class="k">消耗占比</div><div class="v '+(pool?(usedPct>85?"err":(usedPct>60?"warn":"ok")):"")+'">'+(pool?usedPct+'%':'—')+'</div></div>'+
    '</div>'+
    '<div class="pb">'+
      '<div class="pb-label"><span>消耗进度（已用/额度池）</span><span>'+(pool?usedPct+'%':'—')+'</span></div>'+
      '<div class="pb-track"><div class="pb-bar" style="width:'+(pool?usedPct:0)+'%;background:'+pbColor(usedPct)+'"></div></div>'+
      '<div class="pb-meta">可用 '+remain+' · 已用 '+used+' · 池 '+pool+
        (packs?(' · '+packs+' 个包'):'')+
        '（签到加包会抬高池和可用，不等于没消耗）</div>'+
    '</div>'+
    '<div class="pb">'+
      '<div class="pb-label"><span>积分可读率</span><span>'+readPct+'%</span></div>'+
      '<div class="pb-track"><div class="pb-bar" style="width:'+readPct+'%;background:var(--acc)"></div></div>'+
      '<div class="pb-meta">'+readable+' / '+scoped.length+' 个账号返回了积分'+(scoped.length!==all.length?('（全部 '+all.length+' 个）'):'')+'</div>'+
    '</div>'+
    '<div class="row"><span class="k">调度</span><span class="v">'+schedText+'</span></div>'+
    '<div class="row"><span class="k">上游版本</span><span class="v">'+verText+'</span></div>'+
    '<div class="row"><span class="k">版本跟踪</span><span class="v">'+
      '<span style="margin-right:8px">'+trackText+'</span>'+
      '<button class="sec" type="button" onclick="probeVersion(this)" title="后台重新探测上游版本">重新探测</button>'+
    '</span></div>';
}

var authFailCount=0, authFailUntil=0;

async function call(path,method,body){
  var k=getKey();
  if(!k){showAuth();throw new Error('需要管理密钥')}
  if(Date.now()<authFailUntil)throw new Error('认证多次失败，请稍后重试（防 IP 封禁）');
  var res=await fetch(BASE+path,{
    method:method||'GET',
    credentials:'omit',
    headers:Object.assign({'Content-Type':'application/json'},authHeaders(k)),
    body:body?JSON.stringify(body):undefined
  });
  if(res.status===401){authFailCount++;sessionStorage.removeItem(SS_KEY);showAuth();if(authFailCount>=3){authFailUntil=Date.now()+60000;authFailCount=0;throw new Error('认证多次失败，请检查管理密钥后 60s 再试')}throw new Error('management key 无效或缺失')}
  if(res.status===403){authFailCount++;var btxt='';try{btxt=await res.text()}catch(e){}
    if(/IP banned|too many failed/i.test(btxt)){var waitMs=60000;var m=btxt.match(/(\d+)\s*m(?:in(?:ute)?s?)?\s*(\d+)\s*s/i)||btxt.match(/(\d+)\s*m/i);if(m){var mins=parseInt(m[1],10)||0;var secs=m[2]?parseInt(m[2],10):0;waitMs=Math.min(Math.max((mins*60+secs)*1000,30000),30*60*1000)}authFailUntil=Date.now()+waitMs;throw new Error(btxt.trim()||'IP 被封禁，请稍后再试')}
    if(authFailCount>=3){authFailUntil=Date.now()+60000;authFailCount=0}throw new Error(btxt.trim()||'禁止访问 (403)')}
  authFailCount=0;
  var text=await res.text();
  try{return JSON.parse(text)}catch(e){return {raw:text}}
}

async function refreshMeta(){
  try{
    var r=await Promise.all([call('/status'),call('/version')]);
    statusInfo=r[0]||{};
    versionInfo=r[1]||{};
    var el=document.getElementById('autoToggle');
    if(el)el.checked=!!statusInfo.checkin_auto;
    var sv=document.getElementById('svtime');
    if(sv&&statusInfo.server_time)sv.textContent='服务器时间 '+statusInfo.server_time;
  }catch(e){/* 元数据失败不阻塞账号渲染 */}
}

async function load(force,btn){
  var g=document.getElementById("grid");
  if(!getKey()){
    showAuth();
    g.innerHTML='<div class="loading">请先填写 management key</div>';
    return;
  }
  if(force){
    if(!btn)btn=document.getElementById("refreshBtn");
    busy(btn,true);
  }
  try{
    // force 时 /refresh 已返回全量账号（强制重查积分），不必再打 /accounts。
    var d = force ? await call('/refresh','POST',{}) : await call('/accounts');
    await refreshMeta();
    if(d&&d.error){
      g.innerHTML='<div class="loading">'+esc(d.error)+'</div>';
      if(force)toast("刷新失败","err",String(d.error));
      return;
    }
    var accounts=(d&&d.accounts)||[];
    var active=(d&&d.active)||"";
    lastAccounts=accounts;
    accounts.forEach(function(a){a.selected=(active!==""&&a.auth_id===active)||!!a.selected});
    updateFilterCounts(accounts);
    if(!accounts.length){
      g.innerHTML='<div class="loading">暂无 Trae 账号</div>';
      renderSummary([]);
      if(force)toast("数据已刷新","warn","暂无 Trae 账号");
      return;
    }
    g.innerHTML=accounts.map(card).join("");
    bindCardActions(g);
    filterStatus(currentFilter,null);
    renderSummary(accounts);
    if(force){
      var errN=accounts.filter(function(a){return statusOf(a)==="error"}).length;
      var extra=accounts.length+" 个账号";
      if(errN)extra+=" · "+errN+" 个异常";
      toast("数据已刷新",errN?"warn":"ok",extra);
    }
  }catch(e){
    var msg=(e&&e.message)||String(e);
    if(force)toast("刷新失败","err",msg);
    if(!force||!g.querySelector(".card"))g.innerHTML='<div class="loading">'+esc(msg)+'</div>';
  }finally{
    if(force)busy(btn,false);
  }
}

function isCheckinDoneResult(res){
  if(!res||res.error)return false;
  if(res.reason==="disabled")return false;
  if(res.success)return true;
  var msg=String(res.message||"");
  if(/already|已签|今日/.test(msg))return true;
  return false;
}
function checkinResultToast(res,who){
  var name=(res&&res.nickname)||who||"账号";
  if(!res||res.error){toast(name+"：签到失败","err",String(res&&res.error));return}
  if(res.reason==="already"||(res.skipped&&/already|已签|今日/.test(String(res.message||"")))){
    toast(name+"：今日已签到","ok",String(res.message||""));return;
  }
  if(res.reason==="disabled"){toast(name+"：上游关闭签到","warn",String(res.message||""));return}
  if(res.success){toast(name+"：签到成功","ok",(res.credits!=null?("剩余 "+res.credits+" 积分"):""));return}
  toast(name+"："+(res.message||"未知结果"),"warn");
}

async function checkinOne(idx,btn){
  busy(btn,true);
  try{
    var d=await call('/checkin','POST',{auth_index:idx});
    var res=(d.results||[])[0]||{};
    checkinResultToast(res,idx);
    if(isCheckinDoneResult(res)){
      // 立即标记，busy(false) 会把按钮还原成"签到"，load() 完成前会闪。
      markCheckinDone(btn);
    }else{
      busy(btn,false);
    }
    await load(false);
  }catch(e){
    toast("签到请求失败","err",(e&&e.message)||String(e));
    busy(btn,false);
  }
}

async function checkinAll(btn){
  busy(btn,true);
  try{
    var d=await call('/checkin','POST',{});
    var s=d.summary||{};
    var rs=d.results||[];
    var okN=Number(s.success??0), alreadyN=Number(s.already??0), failN=Number(s.fail??0);
    var detail="共 "+Number(s.total??rs.length)+" 个账号"+(alreadyN?(" · 今日已签 "+alreadyN):"");
    if(d.error)toast("批量签到失败","err",String(d.error));
    else if(failN){
      var errDetail=rs.filter(function(x){return x.error}).map(function(x){return (x.nickname||x.auth_index||"")+": "+x.error}).join("；");
      toast("批量签到："+okN+" 成功 / "+failN+" 失败","err",errDetail||detail);
    }else if(okN)toast("批量签到："+okN+" 成功","ok",detail);
    else if(alreadyN)toast("无需签到","ok",detail);
    else toast("没有需要签到的账号","warn",detail);
    await load(false);
  }catch(e){
    toast("批量签到失败","err",(e&&e.message)||String(e));
  }
  busy(btn,false);
}

async function keepaliveAll(btn){
  busy(btn,true);
  try{
    var r=await call('/keepalive','POST',{});
    var rs=r.results||[];
    var okN=rs.filter(function(x){return !x.error}).length;
    var failN=rs.length-okN;
    if(failN)toast("Token 刷新："+okN+" 成功 / "+failN+" 失败","err",rs.filter(function(x){return x.error}).map(function(x){return (x.nickname||x.auth_index||"")+": "+x.error}).join("；"));
    else toast("Token 已刷新","ok",okN+" 个账号");
    await load(false);
  }catch(e){toast("Token 刷新失败","err",(e&&e.message)||String(e))}
  busy(btn,false);
}

async function keepaliveOne(idx,btn){
  busy(btn,true);
  try{
    var r=await call('/keepalive','POST',{auth_index:idx});
    var res=(r.results||[])[0]||{};
    if(res.error)toast("刷新 Token 失败","err",String(res.error));
    else toast("Token 已刷新","ok",(res.nickname||idx)+(res.refreshed?" · 已写入":" · 无需刷新"));
    await load(false);
  }catch(e){toast("刷新 Token 失败","err",(e&&e.message)||String(e));busy(btn,false)}
}

async function selectAuth(idx,btn){
  busy(btn,true);
  try{
    var r=await call('/select','POST',{auth_index:idx});
    if(r.error){toast("选用失败","err",String(r.error));busy(btn,false);return}
    var who=r.nickname||idx;
    toast("已选用","ok",who+" · 后续请求走该账号（粘性路由）");
    lastAccounts.forEach(function(a){a.selected=(a.auth_id===r.active_auth)});
    var g=document.getElementById("grid");
    if(g){
      g.innerHTML=accountsForFilter(lastAccounts).map(card).join("");
      bindCardActions(g);
    }
    filterStatus(currentFilter,null);
  }catch(e){
    toast("选用失败","err",(e&&e.message)||String(e));
  }finally{busy(btn,false)}
}

async function refreshOne(idx,btn){
  busy(btn,true);
  try{
    var d=await call('/credits?auth_index='+encodeURIComponent(idx));
    var acct=(d.accounts||[])[0]||d||{};
    if(d.error||acct.error){
      toast("刷新失败","err",String(d.error||acct.error||"未知错误"));
      busy(btn,false);return;
    }
    var a=lastAccounts.find(function(x){return x.auth_index===idx});
    if(a){
      if(acct.credits!==null&&acct.credits!==undefined)a.credits=acct.credits;
      if(acct.credits_detail)a.credits_detail=acct.credits_detail;
      else if(acct.credits_total||acct.credits_used||acct.pack_count){
        a.credits_detail={total_remain:Number(acct.credits)||0,
          total_used:Number(acct.credits_used)||0,
          total_size:Number(acct.credits_total)||0,
          pack_count:Number(acct.pack_count)||0};
      }
      if(acct.error)a.error=acct.error;else a.error="";
      updateOneCard(a);
    }
    var remain=(acct.credits_detail&&acct.credits_detail.total_remain!=null)?acct.credits_detail.total_remain:acct.credits;
    toast("积分已刷新","ok",(acct.nickname||idx)+" · 剩余 "+(remain!=null?remain:"—"));
  }catch(e){
    toast("刷新失败","err",(e&&e.message)||String(e));
  }finally{busy(btn,false)}
}

async function toggleAuto(on){
  try{
    var d=await call('/checkin/config','POST',{enabled:on});
    toast("自动签到已"+(d.checkin_auto?"开启":"关闭"),"ok",d.persistent===false?"重启后回到 config_yaml 的值":"");
    if(statusInfo)statusInfo.checkin_auto=!!d.checkin_auto;
    renderSummary(lastAccounts);
  }catch(e){toast("设置失败","err",(e&&e.message)||String(e))}
}

async function probeVersion(btn){
  busy(btn,true);
  try{
    await call('/version/refresh','POST',{});
    toast("版本探测已开始","ok","后台探测，稍后点「重新加载」查看结果");
  }catch(e){toast("版本探测失败","err",(e&&e.message)||String(e))}
  busy(btn,false);
}

function openImportModal(){
  var m=document.getElementById("importModal");
  m.classList.add("show");
  var ta=document.getElementById("importRaw");
  if(ta)setTimeout(()=>ta.focus(),0);
}
function closeImportModal(){document.getElementById("importModal").classList.remove("show")}
function onImportMaskClick(e){if(e.target===document.getElementById("importModal"))closeImportModal()}
async function importAuth(btn){
  var raw=(document.getElementById("importRaw").value||"").trim();
  if(!raw){toast("请粘贴凭证 JSON","warn");return}
  busy(btn,true);
  try{
    var payload={raw:raw};
    try{payload={json:JSON.parse(raw)}}catch(e){}
    var d=await call('/import','POST',payload);
    if(d.success){
      toast("导入成功","ok",(d.nickname||d.uid||"")+" → "+(d.file||""));
      document.getElementById("importRaw").value="";
      closeImportModal();
      await load(true);
    }else toast("导入失败","err",String(d.error||"unknown"));
  }catch(e){toast("导入请求失败","err",(e&&e.message)||String(e))}
  busy(btn,false);
}

document.getElementById("keyInput").addEventListener("keydown",function(e){if(e.key==="Enter")saveKey()});
document.addEventListener("keydown",function(e){
  if(e.key=="Escape"&&document.getElementById("importModal").classList.contains("show"))closeImportModal();
});
/* Start theme sync watcher (parent MutationObserver + standalone prefers-color-scheme listener). */
if(window.__traeThemeSync)window.__traeThemeSync();
if(getKey()){
  load(false);
}else{
  showAuth();
}
